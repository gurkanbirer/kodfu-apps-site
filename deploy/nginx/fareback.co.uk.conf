# fareback.co.uk (FareBack site) on kodfu-box. Source: kodfu-apps-site/deploy/nginx/, installed as
# /etc/nginx/sites-available/fareback.co.uk (+ sites-enabled link) by `deploy/deploy.sh nginx` once
# FAREBACK_HOST in tools/build.py is fareback.co.uk (switch-over: docs/deployment.md). nginx -t && nginx -s reload,
# never a restart: ~30 other sites share this nginx.
# Cloudflare proxied, SSL Full (Strict), Authenticated Origin Pulls (like sparkwiseapp.co.uk): Origin CA cert from
# `deploy/cloudflare.py --domain fareback.co.uk origin-cert` + Cloudflare's origin-pull CA as client CA, so only
# Cloudflare gets through. www -> apex is a Cloudflare redirect (repeated here in case a request reaches the origin).

server {
    listen 80;
    listen [::]:80;
    server_name fareback.co.uk www.fareback.co.uk;
    server_tokens off;
    return 301 https://fareback.co.uk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fareback.co.uk www.fareback.co.uk;
    server_tokens off;

    ssl_certificate     /etc/nginx/fareback/cf-origin.pem;
    ssl_certificate_key /etc/nginx/fareback/cf-origin.key;
    ssl_client_certificate /etc/nginx/fareback/cf-origin-pull-ca.pem;
    ssl_verify_client on;

    if ($host = www.fareback.co.uk) {
        return 301 https://fareback.co.uk$request_uri;
    }

    root /srv/kodfu-apps-site/fareback/current;
    index index.html;
    access_log off;                       # no visitor logs: the sites promise no tracking
    error_log  /var/log/nginx/kodfu-apps-fareback.error.log;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;

    location ~ /\. { return 404; }
    location ~ ^/guide/?$ { return 301 /delay-repay/; }   # old Delay Repay guide (28/11/2026)
    location = /404.html { internal; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / {
        expires 10m;
        try_files $uri $uri/ =404;
    }
}
