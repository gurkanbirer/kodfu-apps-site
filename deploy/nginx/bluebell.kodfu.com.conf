# bluebell.kodfu.com (Bluebell site) on kodfu-box. Source: kodfu-apps-site/deploy/nginx/, installed as
# /etc/nginx/sites-available/bluebell.kodfu.com (+ sites-enabled link) by `deploy/deploy.sh nginx`
# (nginx -t && nginx -s reload; never a restart). DNS: GoDaddy explicit A bluebell -> 65.108.102.251
# (deploy/godaddy-a.sh). TLS: the box's *.kodfu.com wildcard (certbot + GoDaddy DNS-01, renews itself).

server {
    listen 80;
    listen [::]:80;
    server_name bluebell.kodfu.com;
    server_tokens off;
    return 301 https://bluebell.kodfu.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bluebell.kodfu.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/kodfu-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodfu-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/kodfu-apps-site/bluebell/current;
    index index.html;
    access_log off;                       # no visitor logs: the sites promise no tracking
    error_log  /var/log/nginx/kodfu-apps-bluebell.error.log;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;

    location ~ /\. { return 404; }
    location = /404.html { internal; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / {
        expires 10m;
        try_files $uri $uri/ =404;
    }
}
