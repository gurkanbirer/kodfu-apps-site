# sparkwiseapp.co.uk (Sparkwise site) on kodfu-box. Source: kodfu-apps-site/deploy/nginx/, installed as
# /etc/nginx/sites-available/sparkwiseapp.co.uk (+ sites-enabled link) by `deploy/deploy.sh nginx`
# (nginx -t && nginx -s reload; never a restart: ~30 other sites share this nginx).
# Cloudflare proxied, SSL Full (Strict), global Authenticated Origin Pulls (like madebyada.co.uk):
# Origin CA cert + Cloudflare's origin-pull CA as client CA, so only Cloudflare gets through.
# www -> apex is a Cloudflare redirect (repeated here in case a request reaches the origin).

server {
    listen 80;
    listen [::]:80;
    server_name sparkwiseapp.co.uk www.sparkwiseapp.co.uk;
    server_tokens off;
    return 301 https://sparkwiseapp.co.uk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sparkwiseapp.co.uk www.sparkwiseapp.co.uk;
    server_tokens off;

    ssl_certificate     /etc/nginx/sparkwiseapp/cf-origin.pem;
    ssl_certificate_key /etc/nginx/sparkwiseapp/cf-origin.key;
    ssl_client_certificate /etc/nginx/sparkwiseapp/cf-origin-pull-ca.pem;
    ssl_verify_client on;

    if ($host = www.sparkwiseapp.co.uk) {
        return 301 https://sparkwiseapp.co.uk$request_uri;
    }

    root /srv/kodfu-apps-site/sparkwise/current;
    index index.html;
    access_log off;                       # no visitor logs: the sites promise no tracking
    error_log  /var/log/nginx/kodfu-apps-sparkwise.error.log;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;

    location ~ /\. { return 404; }
    location = /404.html { internal; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / {
        expires 10m;
        try_files $uri $uri/ =404;
    }
}
