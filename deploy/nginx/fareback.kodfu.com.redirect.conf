# fareback.kodfu.com AFTER the switch to fareback.co.uk: every URL 301s to the same path on the new domain.
# NOT installed until the switch-over (docs/deployment.md, "FareBack: switch to fareback.co.uk"): `deploy/deploy.sh
# nginx` installs this file as /etc/nginx/sites-available/fareback.kodfu.com when FAREBACK_HOST is fareback.co.uk.
# The Play Data safety deletion URL https://fareback.kodfu.com/#delete keeps working: browsers carry the #fragment
# over a redirect, so it lands on https://fareback.co.uk/#delete (the home page keeps id="delete").
# The Search Console verification file is still served here, so the old URL-prefix property stays verified for
# the Change of Address tool. TLS: the box's *.kodfu.com wildcard, as before.

server {
    listen 80;
    listen [::]:80;
    server_name fareback.kodfu.com;
    server_tokens off;
    location ~ ^/guide/?$ { return 301 https://fareback.co.uk/delay-repay/; }
    location / { return 301 https://fareback.co.uk$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fareback.kodfu.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/kodfu-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodfu-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log  /var/log/nginx/kodfu-apps-fareback.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /googleea66026b8981bf38.html { root /srv/kodfu-apps-site/fareback/current; }
    location ~ ^/guide/?$ { return 301 https://fareback.co.uk/delay-repay/; }
    location / { return 301 https://fareback.co.uk$request_uri; }
}
